name: Build Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to append mac/linux assets to (e.g. v0.1.0). Leave empty to build without publishing."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: kgpos-windows
          - os: macos-latest
            script: dist:mac
            artifact: kgpos-macos
          - os: ubuntu-latest
            script: dist:linux
            artifact: kgpos-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules for Electron
        run: npm run rebuild
      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.script }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - name: Resolve tag for publishing
        id: tag
        run: |
          if [ "${{ github.event.inputs.release_tag }}" != "" ]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: dist-assets/**/*
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}